services:
  postgres:
    image: postgres:15
    container_name: enerkrut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enerkrut
      TZ: Asia/Yekaterinburg
    ports:
      - "5432:5432"
    volumes:
      - enerkrut_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enerkrut"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  enerkrut_pgdata:
